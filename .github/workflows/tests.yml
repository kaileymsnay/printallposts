name: Tests

on:
  push:
    branches:
      - master
      - develop
  
  pull_request:
    branches:
      - master
      - develop

jobs:
  call-tests:
    name: Extension tests
    uses: phpbb-extensions/test-framework/.github/workflows/tests.yml@3.3.x
    with:
      EXTNAME: phpbbmodders/printallposts

      # The phpBB repository's branch to use when running tests
      PHPBB_BRANCH: '3.3.x'

      # Check for files with executable permissions?
      EXECUTABLE_FILES: 1

      # Remove embedded ICC profiles from images?
      IMAGE_ICC: 1

      # Run CodeSniffer to detect PHP code style issues?
      SNIFF: 1

      # Run MySQL/MariaDB tests?
      RUN_MYSQL_JOBS: 0

      # Run PostgreSQL tests?
      RUN_PGSQL_JOBS: 0

      # Run MSSQL and SQLite3 tests?
      RUN_MSSQL_JOBS: 0

      # Run Windows IIS & PostgreSQL tests?
      RUN_WINDOWS_JOBS: 0

      # Run functional tests?
      RUN_FUNCTIONAL_TESTS: 0

      # Install npm dependencies?
      RUN_NPM_INSTALL: 0

      # Install Composer dependencies?
      RUN_COMPOSER_INSTALL: 0

      # CUSTOMISE PHP VERSIONS

      # Preferred PHP version used for all test jobs
      PRIMARY_PHP_VERSION: '8.3'

      # The MySQL and PostgreSQL jobs run tests across multiple PHP versions
      PHP_VERSION_MATRIX: '["8.3", "8.4", "8.5"]'

      # Generate a code coverage report?
      CODECOV: 0

  # EPV (Extension Pre Validator), failing on any Fatal or Error finding not
  # listed in .github/epv-allowed.txt
  epv:
    uses: phpbbmodders/.github/.github/workflows/epv.yml@v1
      with:
        EXTNAME: phpbbmodders/printallposts
